version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # The Vite plugin and ts-jest require the JavaScript compiler API from TypeScript 6.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      npm-workspace-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-workspace-major:
        patterns:
          - "*"
        update-types:
          - "major"
